# Client-bounds pack — Rust (EVOL-106). Framework-shipped, run by gate.py bounds where hosting.type == function.
# Sourced forms: AWS Rust TimeoutConfig operation_timeout (whole call), connect_timeout + operation_attempt_timeout + RetryConfig::standard().with_max_attempts (total); reqwest ClientBuilder timeout (whole call), connect_timeout + read_timeout + max_retries_per_request (retries; reqwest retries 2 times by default, so the count must be written).
# Known-cold forms are in no rule (ADR-EVOL-106).
# A builder chain is read as one construction: $X is the chain before .build() / .load(); a value is "on the chain" when the origin call sits inside it.
rules:
  - id: rust-reqwest-extract-deadline
    languages: [rust]
    severity: WARNING
    message: deadline $D $U
    metadata: {bounds: extract, client: reqwest}
    paths:
      exclude: ["tests/", "test/", "benches/", "*_test.rs", "*_tests.rs"]
    patterns:
      - pattern: $X.build()
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-either:
                - pattern: <... Client::builder() ...>
                - pattern: <... reqwest::Client::builder() ...>
                - pattern: <... reqwest::ClientBuilder::new() ...>
            - pattern: <... $T.timeout(Duration::$U($D)) ...>
            - metavariable-regex:
                metavariable: $U
                regex: ^from_(secs|millis|mins)$
            - metavariable-regex:
                metavariable: $D
                regex: ^[0-9][0-9_]*(\.[0-9]+)?[lL]?$
  - id: rust-reqwest-extract-retries
    languages: [rust]
    severity: WARNING
    message: bound retries $C $U1 $R $U2 $N
    metadata: {bounds: extract, client: reqwest}
    paths:
      exclude: ["tests/", "test/", "benches/", "*_test.rs", "*_tests.rs"]
    patterns:
      - pattern: $X.build()
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-either:
                - pattern: <... Client::builder() ...>
                - pattern: <... reqwest::Client::builder() ...>
                - pattern: <... reqwest::ClientBuilder::new() ...>
            - pattern: <... $A.connect_timeout(Duration::$U1($C)) ...>
            - pattern: <... $B.read_timeout(Duration::$U2($R)) ...>
            - pattern: <... $Q.max_retries_per_request($N) ...>
            - metavariable-regex:
                metavariable: $U1
                regex: ^from_(secs|millis|mins)$
            - metavariable-regex:
                metavariable: $U2
                regex: ^from_(secs|millis|mins)$
            - metavariable-regex:
                metavariable: $C
                regex: ^[0-9][0-9_]*(\.[0-9]+)?[lL]?$
            - metavariable-regex:
                metavariable: $R
                regex: ^[0-9][0-9_]*(\.[0-9]+)?[lL]?$
            - metavariable-regex:
                metavariable: $N
                regex: ^[0-9][0-9_]*(\.[0-9]+)?[lL]?$
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-either:
                - pattern: Client::builder()
                - pattern: reqwest::Client::builder()
                - pattern: reqwest::ClientBuilder::new()
            - pattern-not-inside: $T.timeout($V)
  - id: rust-reqwest-unbounded
    languages: [rust]
    severity: WARNING
    # One branch per missing value; any .retry(...) policy counts as a count (a bound from a variable is still a bound).
    message: This reqwest client has no bound — reqwest waits forever by default and the function dies mid-call. Set .timeout(...) on the builder, or connect_timeout, read_timeout and a retry count; the function's timeout_seconds must cover their product.
    metadata: {bounds: unbounded, client: reqwest}
    paths:
      exclude: ["tests/", "test/", "benches/", "*_test.rs", "*_tests.rs"]
    pattern-either:
      - pattern: reqwest::Client::new()
      - pattern: Client::new()
      - pattern: reqwest::Client::default()
      - pattern: reqwest::get($URL)
      - patterns:
          - pattern: $X.build()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: Client::builder()
                    - pattern: reqwest::Client::builder()
                    - pattern: reqwest::ClientBuilder::new()
                - pattern-not-inside: $T.timeout($V)
                - pattern-not-inside: $A.connect_timeout($V)
      - patterns:
          - pattern: $X.build()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: Client::builder()
                    - pattern: reqwest::Client::builder()
                    - pattern: reqwest::ClientBuilder::new()
                - pattern-not-inside: $T.timeout($V)
                - pattern-not-inside: $B.read_timeout($V)
      - patterns:
          - pattern: $X.build()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: Client::builder()
                    - pattern: reqwest::Client::builder()
                    - pattern: reqwest::ClientBuilder::new()
                - pattern-not-inside: $T.timeout($V)
                - pattern-not-inside: $Q.retry($V)
  - id: rust-aws-extract-deadline
    languages: [rust]
    severity: WARNING
    message: deadline $D $U
    metadata: {bounds: extract, client: aws}
    paths:
      exclude: ["tests/", "test/", "benches/", "*_test.rs", "*_tests.rs"]
    patterns:
      - pattern: $X.build()
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-either:
                - pattern: <... TimeoutConfig::builder() ...>
                - pattern: <... aws_config::timeout::TimeoutConfig::builder() ...>
            - pattern: <... $T.operation_timeout(Duration::$U($D)) ...>
            - metavariable-regex:
                metavariable: $U
                regex: ^from_(secs|millis|mins)$
            - metavariable-regex:
                metavariable: $D
                regex: ^[0-9][0-9_]*(\.[0-9]+)?[lL]?$
  - id: rust-aws-extract-total
    languages: [rust]
    severity: WARNING
    # Only the inline form: TimeoutConfig and RetryConfig written on the loader chain itself.
    message: bound total $C $U1 $R $U2 $N
    metadata: {bounds: extract, client: aws}
    paths:
      exclude: ["tests/", "test/", "benches/", "*_test.rs", "*_tests.rs"]
    patterns:
      - pattern: $X.load()
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-either:
                - pattern: <... aws_config::defaults($BV) ...>
                - pattern: <... aws_config::from_env() ...>
            - pattern: <... $A.connect_timeout(Duration::$U1($C)) ...>
            - pattern: <... $B.operation_attempt_timeout(Duration::$U2($R)) ...>
            - pattern: <... RetryConfig::standard().with_max_attempts($N) ...>
            - metavariable-regex:
                metavariable: $U1
                regex: ^from_(secs|millis|mins)$
            - metavariable-regex:
                metavariable: $U2
                regex: ^from_(secs|millis|mins)$
            - metavariable-regex:
                metavariable: $C
                regex: ^[0-9][0-9_]*(\.[0-9]+)?[lL]?$
            - metavariable-regex:
                metavariable: $R
                regex: ^[0-9][0-9_]*(\.[0-9]+)?[lL]?$
            - metavariable-regex:
                metavariable: $N
                regex: ^[0-9][0-9_]*(\.[0-9]+)?[lL]?$
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-either:
                - pattern: TimeoutConfig::builder()
                - pattern: aws_config::timeout::TimeoutConfig::builder()
            - pattern-not-inside: $T.operation_timeout($V)
  - id: rust-aws-unbounded
    languages: [rust]
    severity: WARNING
    # No timeout_config at all, or an inline TimeoutConfig with no operation_timeout and one value missing (a TimeoutConfig from a variable is a bound).
    message: This AWS SDK config has no bound — by default nothing limits the read, so a call can outlive the function. Set TimeoutConfig operation_timeout, or connect_timeout, operation_attempt_timeout and RetryConfig max attempts; the function's timeout_seconds must cover their product.
    metadata: {bounds: unbounded, client: aws}
    paths:
      exclude: ["tests/", "test/", "benches/", "*_test.rs", "*_tests.rs"]
    pattern-either:
      - pattern: aws_config::load_from_env()
      - pattern: aws_config::load_defaults($BV)
      - patterns:
          - pattern: $X.load()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: aws_config::defaults($BV)
                    - pattern: aws_config::from_env()
                - pattern-not-inside: $W.timeout_config($V)
      - patterns:
          - pattern: $X.load()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: aws_config::defaults($BV)
                    - pattern: aws_config::from_env()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: TimeoutConfig::builder()
                    - pattern: aws_config::timeout::TimeoutConfig::builder()
                - pattern-not-inside: $T.operation_timeout($V)
                - pattern-not-inside: $A.connect_timeout($V)
      - patterns:
          - pattern: $X.load()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: aws_config::defaults($BV)
                    - pattern: aws_config::from_env()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: TimeoutConfig::builder()
                    - pattern: aws_config::timeout::TimeoutConfig::builder()
                - pattern-not-inside: $T.operation_timeout($V)
                - pattern-not-inside: $B.operation_attempt_timeout($V)
      - patterns:
          - pattern: $X.load()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: aws_config::defaults($BV)
                    - pattern: aws_config::from_env()
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: TimeoutConfig::builder()
                    - pattern: aws_config::timeout::TimeoutConfig::builder()
                - pattern-not-inside: $T.operation_timeout($V)
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern-either:
                    - pattern: aws_config::defaults($BV)
                    - pattern: aws_config::from_env()
                - pattern-not-inside: $R.retry_config($V)
