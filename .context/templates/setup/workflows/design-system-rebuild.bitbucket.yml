# ============================================================================
# Design System Rebuild — Bitbucket Pipelines — ADVISORY, never fails the pipeline
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory | EVOL-084
# Platform: Bitbucket Pipelines — merged into bitbucket-pipelines.yml (target_mode: merge)
#
# Materialised by SETUP --generate ONLY when the project has a frontend and
# configured a design-system rebuild command (docs/setup.md §
# po_package.ds_rebuild_command).
#
# Rebuilds the design-system preview cards from code through the PO package
# builder, reports card-to-registry drift, and keeps the bundle as an artifact.
# It is a producer: the check that shipped UI is built from the catalog is the
# gate (`gate.py catalog`, DC-45), not this job.
#
# The rebuild tool is the project's own — this pipeline names none. The builder
# reads the command from subproducts/po-package/po-package.config.json at run
# time, runs it WITHOUT a shell and with a timeout. A missing or failing tool
# degrades to the vision cards with a loud warning; it never blocks.
#
# Runs on the main branch and on demand (custom: design-system-rebuild) — never
# on pull requests, so a fork can never make this job run a command it supplies.
#
# If your rebuild command needs a toolchain (for example a package install),
# add that line where marked below, in both steps — below the unset, so a
# dependency's install script never sees the framework's credentials.
#
# The builder stages outside the clone (it refuses a folder inside the
# repository); the bundle is copied back in for the artifact.
#
# Bitbucket hands every repository variable to every step. The step unsets the
# framework's own credentials (the documents and SCM readers of the governance
# check) before the project's command runs; keep any other secret as a secured
# Deployment variable, never a repository variable (as the deploy pipeline does).
#
# This step sits before the deploy pipeline's manual production step in the
# merged main pipeline — after it, it would wait for the button.
# ============================================================================

pipelines:
  branches:
    main:
      - step:
          name: Design system rebuild (advisory)
          image: python:3.12
          script:
            - unset BITBUCKET_TOKEN CONFLUENCE_API_TOKEN CONFLUENCE_USER_EMAIL
            # ── Add here whatever your rebuild command needs (toolchain, dependencies) — below the unset. ──
            - rc=0; python3 subproducts/po-package/build_po_package.py --mode ds-only --rebuild --check-drift --no-zip --out /tmp/ds-bundle || rc=$?
            - if [ "$rc" -eq 0 ]; then mkdir -p ds-bundle && cp -R /tmp/ds-bundle/. ds-bundle/; echo "Design-system bundle rebuilt. Read the drift lines above; publish the mirror with /design-sync when you want it refreshed."; else echo "WARNING the design-system rebuild did not complete (exit $rc). See subproducts/po-package/RUNBOOK.md section 9. This step is advisory."; fi
          artifacts:
            - ds-bundle/**
  custom:
    design-system-rebuild:
      - step:
          name: Design system rebuild (advisory)
          image: python:3.12
          script:
            - unset BITBUCKET_TOKEN CONFLUENCE_API_TOKEN CONFLUENCE_USER_EMAIL
            # ── Add here whatever your rebuild command needs (toolchain, dependencies) — below the unset. ──
            - rc=0; python3 subproducts/po-package/build_po_package.py --mode ds-only --rebuild --check-drift --no-zip --out /tmp/ds-bundle || rc=$?
            - if [ "$rc" -eq 0 ]; then mkdir -p ds-bundle && cp -R /tmp/ds-bundle/. ds-bundle/; echo "Design-system bundle rebuilt. Read the drift lines above; publish the mirror with /design-sync when you want it refreshed."; else echo "WARNING the design-system rebuild did not complete (exit $rc). See subproducts/po-package/RUNBOOK.md section 9. This step is advisory."; fi
          artifacts:
            - ds-bundle/**
