# ============================================================================
# Governance Check on PR — GitHub Actions
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory
# Platform: GitHub Actions
#
# Runs the gate profile this PR owes — ONE definition (EVOL-046): python3 scripts/gate.py profile --run
# reads the mode key from the project's governance manifest (fail-closed to production) and the
# branch class, then runs every script member with all-report semantics (ADR sync,
# law parity, budgets, retired vocabulary, artefact currency, manifest parity, surface ceiling). A
# sub-increment PR into its train in development mode owes the light profile; everything to main owes
# the full one. The workflow itself reads no manifest and keeps no branch list (gate.py one-definition).
# Add project-specific gates as further members in scripts/gates/profile.py, never as ad-hoc steps.
# ============================================================================

name: Governance Check

on:
  pull_request:   # every PR — a sub-increment PR targets its train, not main (EVOL-045)

permissions:
  contents: read
  pull-requests: write

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: "Gate profile — ONE definition (EVOL-046): the mode key × the branch class → the members this PR owes, all-report (ADR sync, law parity, budgets, retired vocabulary, currency, manifest parity, surface, runtime-surface parity)"
        run: |
          python3 scripts/gate.py profile --run --control-point ci --base "origin/${{ github.base_ref }}" --branch "${{ github.head_ref }}"

      - name: "One definition — hooks, workflows and the preflight keep no branch list, mode read or mode override (EVOL-046)"
        run: python3 scripts/gate.py one-definition

      - name: Post violation comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "## 🛑 Governance Check Failed

          One or more governance gates failed. See the workflow logs for the offending file(s).

          **Common causes:**

          - An ADR file transitioned to \`status: accepted\` without amending \`docs/constitution.md\` in the same PR.
            **Fix:** run the \`factory-adr-management\` Accept Procedure on each offending ADR — it amends constitution.md atomically and produces a single commit that passes the gate.
            **One-shot bypass (historical migration only):** include \`[adr-backfill]\` in any commit message in the PR.

          Run locally to verify: \`python3 scripts/gate.py profile --run --base origin/main\` (every member reports; the verdict names the red ones)"
