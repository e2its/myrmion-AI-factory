# ============================================================================
# Governance Check on Merge Request — GitLab CI
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory
# Platform: GitLab CI
#
# Runs the governance gates that must pass before an MR can merge to main:
#
#   - python3 scripts/gate.py profile --run — the gate profile this PR owes (EVOL-046: one call, all members
#     report — ADR sync, law parity, budgets, retired vocabulary, currency, manifest parity, surface);
#     plus gate.py one-definition. ADR sync was the single-source-of-truth
#     gate. Bypass via [adr-backfill] commit message marker.
#
# To wire this into an existing .gitlab-ci.yml, include this job under the
# `stages: [governance]` stage (or merge into your existing stage layout)
# and ensure pipelines run on merge_request events.
# ============================================================================

stages:
  - governance

governance-check:
  stage: governance
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # every MR — a sub-increment MR targets its train, not main (EVOL-045)
  before_script:
    - apk add --no-cache bash git python3
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  # EVOL-080: when config/quality.json → documents names a store, the documents member reads the approved artefacts kept outside the repo with a read-only service-account credential — CONFLUENCE_API_TOKEN (and CONFLUENCE_USER_EMAIL on Cloud), or each name in documents.credentials for a built store; missing or refused at the ci control point is a RED wiring finding, unless documents.verify: local (declared at SETUP) — as masked, protected CI/CD variables
  # EVOL-054: GITLAB_TOKEN (scope read_api) as a masked, protected CI/CD variable lets the scm-protection member read the protected branches at the ci control point; without it the member is n/a with the checklist (never a silent green)
  script:
    - python3 scripts/gate.py profile --run --control-point ci --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - python3 scripts/gate.py one-definition
  variables:
    GIT_DEPTH: 0
