# ============================================================================
# Deploy — Bitbucket Pipelines (EVOL-081: CI-only delivery)
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory
# Platform: Bitbucket Pipelines — merged into bitbucket-pipelines.yml when delivery.execution is ci.
#
# The pipeline is the only deployer. Every deploy, rollback and teardown calls ONE executor,
# python3 scripts/gate.py delivery, which reads the deploy tool's row (config/quality.json → delivery.adapter):
# validate → plan → migrate → apply → probe every healthCheckPath → performance → the record tag
# deploy/{env}/{ts} → the lkg tag when green. This file only orders steps, holds the approval and pushes the tags.
# Production waits for a person: `deployment: production` + `trigger: manual` (a manual step is never the
# first of a pipeline). Bitbucket has no separate approval: without Premium deployment permissions any user
# with write access can press it — the runbook (docs/scm/protection.md) names the setting.
# The adapter's secrets are secured Deployment variables under the names of the row (vault names only).
# Merged into bitbucket-pipelines.yml (target_mode: merge): every step names its own image.
# DEVOPS --deploy starts `custom: deploy-{env}` / `rollback-{env}` / `teardown-{env}` through the pipelines API.
# gate.py delivery --check (a light profile member) holds this file to these rules.
# ============================================================================

definitions:
  steps:
    - step: &check
        image: atlassian/default-image:4
        name: Check the deploy pipeline
        script:
          - python3 scripts/gate.py delivery --check

pipelines:
  pull-requests:
    '**':
      - step:
          image: atlassian/default-image:4
          name: The agent verdicts — preventive sweep and smoke (owed for a feature branch, full-sdlc, not docs only)
          clone:
            depth: full
          script:
            - git fetch origin "$BITBUCKET_PR_DESTINATION_BRANCH"
            - python3 scripts/gate.py delivery --pr --base "origin/${BITBUCKET_PR_DESTINATION_BRANCH}" --branch "$BITBUCKET_BRANCH"
            - python3 scripts/gate.py currency --base "origin/${BITBUCKET_PR_DESTINATION_BRANCH}"
  branches:
    main:
      - step:
          image: atlassian/default-image:4
          name: Deploy staging
          deployment: staging
          clone:
            depth: full
          script:
            - git fetch --tags --force origin
            - python3 scripts/gate.py delivery --run --env staging
          after-script:
            - git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'
      - step:
          image: atlassian/default-image:4
          name: Deploy production
          deployment: production
          trigger: manual
          clone:
            depth: full
          script:
            - git fetch --tags --force origin
            - python3 scripts/gate.py delivery --run --env production
          after-script:
            - git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'
  custom:
    deploy-staging:
      - step:
          image: atlassian/default-image:4
          name: Deploy staging
          deployment: staging
          clone:
            depth: full
          script:
            - git fetch --tags --force origin
            - python3 scripts/gate.py delivery --run --env staging
          after-script:
            - git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'
    deploy-production:
      - step: *check
      - step:
          image: atlassian/default-image:4
          name: Deploy production
          deployment: production
          trigger: manual
          clone:
            depth: full
          script:
            - git fetch --tags --force origin
            - python3 scripts/gate.py delivery --run --env production
          after-script:
            - git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'
    rollback-staging:
      - step:
          image: atlassian/default-image:4
          name: Roll back staging to its last lkg
          deployment: staging
          clone:
            depth: full
          script:
            - git fetch --tags --force origin
            - git checkout --detach "$(python3 scripts/gate.py delivery --lkg staging | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
            - python3 scripts/gate.py delivery --rollback --env staging
          after-script:
            - git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'
    rollback-production:
      - step: *check
      - step:
          image: atlassian/default-image:4
          name: Roll back production to its last lkg
          deployment: production
          trigger: manual
          clone:
            depth: full
          script:
            - git fetch --tags --force origin
            - git checkout --detach "$(python3 scripts/gate.py delivery --lkg production | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
            - python3 scripts/gate.py delivery --rollback --env production
          after-script:
            - git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'
    teardown-staging:
      - step:
          image: atlassian/default-image:4
          name: Tear staging down
          deployment: staging
          script:
            - python3 scripts/gate.py delivery --teardown --env staging
    teardown-production:
      - step: *check
      - step:
          image: atlassian/default-image:4
          name: Tear production down
          deployment: production
          trigger: manual
          script:
            - python3 scripts/gate.py delivery --teardown --env production
