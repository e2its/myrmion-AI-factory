# ============================================================================
# Governance Check on PR — Bitbucket Pipelines
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory
# Platform: Bitbucket Pipelines
#
# Runs the governance gates that must pass before a PR can merge to main:
#
#   - python3 scripts/gate.py profile --run — the gate profile this PR owes (EVOL-046: one call, all members
#     report — ADR sync, law parity, budgets, retired vocabulary, currency, manifest parity, surface);
#     plus gate.py one-definition. ADR sync was the single-source-of-truth
#     gate. Bypass via [adr-backfill] commit message marker.
#
# To wire this into an existing bitbucket-pipelines.yml, merge the
# `pull-requests:` block under the existing `pipelines:` key.
# ============================================================================

image: alpine:3.20

pipelines:
  pull-requests:
    '**':   # every PR — a sub-increment PR targets its train, not main (EVOL-045)
      - step:
          name: Governance Check
          caches:
            - apk
          script:
            - apk add --no-cache bash git python3 py3-yaml   # PyYAML: the gates read pipeline files (delivery --check)
            - git fetch origin "$BITBUCKET_PR_DESTINATION_BRANCH"
            # EVOL-080: when config/quality.json → documents names a store, the documents member reads the approved artefacts kept outside the repo with a read-only service-account credential — CONFLUENCE_API_TOKEN (and CONFLUENCE_USER_EMAIL on Cloud), or each name in documents.credentials for a built store; missing or refused at the ci control point is a RED wiring finding, unless documents.verify: local (declared at SETUP) — as secured repository variables
            # EVOL-054: BITBUCKET_TOKEN (user:app_password with repository:read) as a secured repository variable lets the scm-protection member read the branch restrictions at the ci control point; without it the member is n/a with the checklist (never a silent green)
            - python3 scripts/gate.py profile --run --control-point ci --base "origin/$BITBUCKET_PR_DESTINATION_BRANCH" --branch "$BITBUCKET_BRANCH"
            - python3 scripts/gate.py one-definition