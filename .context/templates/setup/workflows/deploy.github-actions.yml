# ============================================================================
# Deploy — GitHub Actions (EVOL-081: CI-only delivery)
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory
# Platform: GitHub Actions — lands when delivery.execution is ci.
#
# The pipeline is the only deployer. Every deploy, rollback and teardown calls ONE executor,
# python3 scripts/gate.py delivery, which reads the deploy tool's row (config/quality.json → delivery.adapter):
# validate → plan → migrate → apply → probe every healthCheckPath → performance → the record tag
# deploy/{env}/{ts} → the lkg tag when green. This file only orders jobs, holds the approval and pushes the tags.
# Production waits for a person: the `production` environment carries required reviewers (Settings →
# Environments; gate.py scm-protection verifies it at ci). A job naming a missing environment creates it
# with NO rules — create it first, with a deployment-branch policy of main only. The adapter's secrets live
# under the names of the row (vault names only) as ENVIRONMENT secrets — production's only in `production`
# (gh secret set NAME --env production), never repository secrets; the executor passes only the row's names.
# A merge that touches nothing on the runtime surface (gate.py runtime-surface) deploys nothing (EVOL-047).
# Each run pushes only its own environment's tags; a dispatch to production runs from main only.
# gate.py delivery --check (a light profile member) holds this file to these rules.
# ============================================================================

name: Deploy
run-name: "deploy ${{ inputs.action || 'deploy' }} ${{ inputs.env || 'main' }} ${{ inputs.run_key || github.sha }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy | rollback (to the last lkg/{env}/* tag) | teardown (the adapter's destroy)"
        type: choice
        options: [deploy, rollback, teardown]
        default: deploy
      env:
        description: "the environment"
        type: choice
        options: [staging, production]
        default: staging
      run_key:
        description: "a unique key echoed in the run name (DEVOPS --deploy finds its run by it)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  pr-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch the base branch"
        run: git fetch origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: "The agent's verdicts for this change — the preventive sweep (RDR 1) and the smoke at the project's cadence (RDR 5, 2026-11-08); owed for a feature, increment or train branch, the full-sdlc preset, not documentation only"
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/gate.py delivery --pr --base "origin/${BASE_REF}" --branch "$HEAD_REF"
      - name: "The sweep verdict is current — its certifies hash matches the head (gate.py currency)"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/gate.py currency --base "origin/${BASE_REF}"

  surface:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      touched: ${{ steps.rs.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Runtime surface touched? (EVOL-047: the positive list in config/quality.json decides)"
        id: rs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"; case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="HEAD^1";; esac
          set +e; python3 scripts/gate.py runtime-surface --changed --base "$BASE"; rc=$?; set -e
          case "$rc" in
            1) echo "touched=false" >> "$GITHUB_OUTPUT"; echo "outside the runtime surface — nothing deploys" ;;
            *) echo "touched=true" >> "$GITHUB_OUTPUT" ;;
          esac

  deploy-staging:
    needs: surface
    if: github.event_name == 'push' && needs.surface.outputs.touched == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch the deploy records"
        run: git fetch --tags --force origin
      - name: "Deploy staging — the one executor (probe, record, lkg)"
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/gate.py delivery --run --env staging
      - name: "Push this environment's record and lkg tags"
        if: always()
        run: git push origin 'refs/tags/deploy/staging/*:refs/tags/deploy/staging/*' 'refs/tags/lkg/staging/*:refs/tags/lkg/staging/*'

  deploy-production:
    if: github.event_name == 'push'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch the deploy records"
        run: git fetch --tags --force origin
      - name: "Deploy production — the one executor (probe, record, lkg)"
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/gate.py delivery --run --env production
      - name: "Push this environment's record and lkg tags"
        if: always()
        run: git push origin 'refs/tags/deploy/production/*:refs/tags/deploy/production/*' 'refs/tags/lkg/production/*:refs/tags/lkg/production/*'

  resolve:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.lkg.outputs.sha }}
    env:
      TARGET: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "The rollback target — shown before anyone approves it"
        id: lkg
        run: |
          git fetch --tags --force origin
          rec=$(python3 scripts/gate.py delivery --lkg "$TARGET")
          sha=$(printf '%s' "$rec" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'Rolling %s back to %s\n\n```json\n%s\n```\n' "$TARGET" "$sha" "$rec" >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    needs: resolve
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && (inputs.env != 'production' || github.ref == 'refs/heads/main')
      && (inputs.action != 'rollback' || needs.resolve.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    permissions:
      contents: write
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.env }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch the deploy records"
        run: git fetch --tags --force origin
      - name: "Deploy the dispatched ref"
        if: inputs.action == 'deploy'
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/gate.py delivery --run --env "$TARGET"
      - name: "Roll back — check out the approved lkg SHA, redeploy it, re-seal (the executor refuses if the lkg moved)"
        if: inputs.action == 'rollback'
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git checkout --detach "$SHA"
          python3 scripts/gate.py delivery --rollback --env "$TARGET"
      - name: "Tear down — the adapter's destroy, no record"
        if: inputs.action == 'teardown'
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/gate.py delivery --teardown --env "$TARGET"
      - name: "Push the record and lkg tags"
        if: always() && inputs.action != 'teardown'
        run: git push origin "refs/tags/deploy/$TARGET/*:refs/tags/deploy/$TARGET/*" "refs/tags/lkg/$TARGET/*:refs/tags/lkg/$TARGET/*"
