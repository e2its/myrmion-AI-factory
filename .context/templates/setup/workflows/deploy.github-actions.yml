# ============================================================================
# Deploy — GitHub Actions (EVOL-081: CI-only delivery)
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory
# Platform: GitHub Actions — lands when delivery.execution is ci.
#
# The pipeline is the only deployer. Every deploy, rollback and teardown calls ONE executor,
# python3 scripts/gate.py delivery, which reads the deploy tool's row (config/quality.json → delivery.adapter):
# validate → plan → migrate → apply → probe every healthCheckPath → performance → the record tag
# deploy/{env}/{ts} → the lkg tag when green. This file only orders jobs, holds the approval and pushes the tags.
# Production waits for a person: the `production` environment carries required reviewers (Settings →
# Environments; gate.py scm-protection verifies it at ci). A job naming a missing environment creates it
# with NO rules — create it first. The adapter's secrets are repository / environment secrets under the
# names of the row (vault names only); the executor passes only those names to the tool.
# gate.py delivery --check (a light profile member) holds this file to these rules.
# ============================================================================

name: Deploy
run-name: "deploy ${{ inputs.action || 'deploy' }} ${{ inputs.env || 'main' }} ${{ inputs.run_key || github.sha }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy | rollback (to the last lkg/{env}/* tag) | teardown (the adapter's destroy)"
        type: choice
        options: [deploy, rollback, teardown]
        default: deploy
      env:
        description: "the environment"
        type: choice
        options: [staging, production]
        default: staging
      run_key:
        description: "a unique key echoed in the run name (DEVOPS --deploy finds its run by it)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: deploy-${{ inputs.env || github.ref }}
  cancel-in-progress: false

jobs:
  pr-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch the base branch"
        run: git fetch origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: "The agent's verdicts for this change — the preventive sweep (RDR 1) and the smoke at the project's cadence (RDR 1, 2026-11-08); owed for a feature branch, the full-sdlc preset, not documentation only"
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/gate.py delivery --pr --base "origin/${BASE_REF}" --branch "$HEAD_REF"
      - name: "The sweep verdict is current — its certifies hash matches the head (gate.py currency)"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/gate.py currency --base "origin/${BASE_REF}"

  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch the deploy records"
        run: git fetch --tags --force origin
      - name: "Deploy staging — the one executor (probe, record, lkg)"
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/gate.py delivery --run --env staging
      - name: "Push the record and lkg tags"
        if: always()
        run: git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'

  deploy-production:
    if: github.event_name == 'push'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch the deploy records"
        run: git fetch --tags --force origin
      - name: "Deploy production — the one executor (probe, record, lkg)"
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/gate.py delivery --run --env production
      - name: "Push the record and lkg tags"
        if: always()
        run: git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'

  dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    env:
      TARGET: ${{ inputs.env }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch the deploy records"
        run: git fetch --tags --force origin
      - name: "Deploy the dispatched ref"
        if: inputs.action == 'deploy'
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/gate.py delivery --run --env "$TARGET"
      - name: "Roll back — check out the last lkg SHA, redeploy it, re-seal"
        if: inputs.action == 'rollback'
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: |
          sha=$(python3 scripts/gate.py delivery --lkg "$TARGET" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          git checkout --detach "$sha"
          python3 scripts/gate.py delivery --rollback --env "$TARGET"
      - name: "Tear down — the adapter's destroy, no record"
        if: inputs.action == 'teardown'
        env:
          DELIVERY_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/gate.py delivery --teardown --env "$TARGET"
      - name: "Push the record and lkg tags"
        if: always() && inputs.action != 'teardown'
        run: git push origin 'refs/tags/deploy/*:refs/tags/deploy/*' 'refs/tags/lkg/*:refs/tags/lkg/*'
