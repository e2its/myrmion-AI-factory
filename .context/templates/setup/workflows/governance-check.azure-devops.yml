# ============================================================================
# Governance Check on PR — Azure DevOps Pipelines
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory
# Platform: Azure DevOps
#
# Runs the governance gates that must pass before a PR can merge to main:
#
#   - python3 scripts/gate.py profile --run — the gate profile this PR owes (EVOL-046: one call, all members
#     report — ADR sync, law parity, budgets, retired vocabulary, currency, manifest parity, surface);
#     plus gate.py one-definition. ADR sync was the single-source-of-truth
#     gate. Bypass via [adr-backfill] commit message marker.
#
# Wire this as a separate pipeline triggered by branch policies on `main`,
# or merge into an existing PR validation pipeline as a stage.
# ============================================================================

trigger: none

pr:
  branches:
    include:
      - '*'   # every PR — a sub-increment PR targets its train, not main (EVOL-045)

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Governance
    jobs:
      - job: GovernanceCheck
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              git fetch origin "$(System.PullRequest.TargetBranch)"
            displayName: 'Fetch base branch'

          - script: |
              python3 scripts/gate.py profile --run --control-point ci --base "origin/$(System.PullRequest.TargetBranch)" --branch "$(echo "$(System.PullRequest.SourceBranch)" | sed "s#^refs/heads/##")"
              python3 scripts/gate.py one-definition
            displayName: 'ADR ↔ Constitution sync'
