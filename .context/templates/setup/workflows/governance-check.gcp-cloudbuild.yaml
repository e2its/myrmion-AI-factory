# ============================================================================
# Governance Check on PR — GCP Cloud Build
# ============================================================================
# Generated by Agent: SETUP | Framework: myrmion-AI-factory
# Platform: GCP Cloud Build
#
# Runs the governance gates that must pass before a PR can merge to main:
#
#   - python3 scripts/gate.py profile --run — the gate profile this PR owes (EVOL-046: one call, all members
#     report — ADR sync, law parity, budgets, retired vocabulary, currency, manifest parity, surface);
#     plus gate.py one-definition. ADR sync was the single-source-of-truth
#     gate. Bypass via [adr-backfill] commit message marker.
#
# Wire this cloudbuild.yaml via a Cloud Build trigger filtered to pull-request
# events targeting `main`. The trigger surfaces _BASE_BRANCH as a substitution.
# ============================================================================

substitutions:
  _BASE_BRANCH: 'main'

steps:
  - name: 'gcr.io/cloud-builders/git'
    id: 'fetch-base'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        git fetch origin "${_BASE_BRANCH}"
        git rev-parse "origin/${_BASE_BRANCH}" >/dev/null

  - name: 'gcr.io/cloud-builders/git'
    id: 'governance-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        python3 scripts/gate.py profile --run --control-point ci --base "origin/${_BASE_BRANCH}" --branch "$BRANCH_NAME"
        python3 scripts/gate.py one-definition
# EVOL-080: when config/quality.json → documents names a store, the documents member reads the approved artefacts kept outside the repo with a read-only service-account credential — CONFLUENCE_API_TOKEN (and CONFLUENCE_USER_EMAIL on Cloud), or each name in documents.credentials for a built store; missing or refused at the ci control point is a RED wiring finding, unless documents.verify: local (declared at SETUP) — from Secret Manager: add `secretEnv: ['CONFLUENCE_API_TOKEN', 'CONFLUENCE_USER_EMAIL']` to the governance-check step and
# availableSecrets:
#   secretManager:
#     - versionName: projects/$PROJECT_ID/secrets/<confluence-token>/versions/latest
#       env: 'CONFLUENCE_API_TOKEN'
#     - versionName: projects/$PROJECT_ID/secrets/<confluence-email>/versions/latest
#       env: 'CONFLUENCE_USER_EMAIL'
options:
  logging: CLOUD_LOGGING_ONLY
