# ============================================================================
# Governance Check — CI Gate for Pull Requests
# ============================================================================
# Validates governance manifest consistency on every PR to main.
# Blocks merge if framework_core files changed without manifest update.
#
# Checks: the gate profile this PR owes (gate.py profile --run — ONE definition, EVOL-046: governance
# manifest drift/orphan/stale/version, ADR sync, applicability, law parity, budgets, retired vocabulary,
# currency, manifest parity, surface), the one-definition scan, the T2 suite and the materialisation smoke.
# ============================================================================

name: Governance Check

# EVOL-040: no paths filter — the gate runs on EVERY PR to main. The old filter
# omitted .claude/hooks/** and .github/workflows/**, so PRs touching only those
# trees skipped the whole gate; full-tree CHECK 2 is only as good as its trigger.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: "Gate profile — ONE definition (EVOL-046): the mode key × the branch class → the members this PR owes, all-report (scripts/gates/profile.py is the list)"
        env:
          GH_TOKEN: ${{ github.token }}   # EVOL-054: the scm-protection member reads this repository's ruleset at the ci control point (metadata: read is enough)
        run: |
          chmod +x scripts/validate-governance.sh scripts/check-adr-constitution-sync.sh scripts/check-applicability-frontmatter.sh
          python3 scripts/gate.py profile --run --control-point ci --base "origin/${{ github.base_ref }}" --branch "${{ github.head_ref }}"

      - name: "One definition — hooks, workflows and the preflight keep no branch list, mode read or mode override (EVOL-046)"
        run: python3 scripts/gate.py one-definition

      - name: Run T2 governance suite (templates + extraction + ADR accept + sync gate + subproducts)
        run: |
          chmod +x scripts/test-templates-static.sh \
                   scripts/test-snapshot-extraction.sh \
                   scripts/test-adr-accept.sh \
                   scripts/test-check-adr-constitution-sync.sh \
                   scripts/test-code-review-gate.sh \
                   scripts/test-materialization-surface.sh \
                   scripts/test-security-scan.sh \
                   scripts/test-check-journey-grammar.sh \
                   scripts/test-check-command-flags.sh \
                   scripts/test-check-design-sections.sh \
                   scripts/test-validate-governance.sh \
                   scripts/test-po-package.sh \
                   scripts/test-measure.sh \
                   scripts/test-hooks.sh \
                   scripts/test-gates.sh
          set -e
          python3 -m pip install --quiet pytest   # the EVOL-053 collection plugin test runs here, never skipped in CI
          for t in scripts/test-templates-static.sh \
                   scripts/test-snapshot-extraction.sh \
                   scripts/test-adr-accept.sh \
                   scripts/test-check-adr-constitution-sync.sh \
                   scripts/test-code-review-gate.sh \
                   scripts/test-materialization-surface.sh \
                   scripts/test-security-scan.sh \
                   scripts/test-check-journey-grammar.sh \
                   scripts/test-check-command-flags.sh \
                   scripts/test-check-design-sections.sh \
                   scripts/test-validate-governance.sh \
                   scripts/test-po-package.sh \
                   scripts/test-measure.sh \
                   scripts/test-hooks.sh \
                   scripts/test-gates.sh; do
            echo "════════ Running $t ════════"
            bash "$t"
          done

      - name: Codebase inventory drift (advisory)
        run: |
          chmod +x scripts/check-inventory-drift.sh
          bash scripts/check-inventory-drift.sh --warn-only

      - name: Synthetic materialisation smoke (corpus, gates, hooks on a scratch project)
        run: |
          chmod +x scripts/materialize-synthetic.sh
          bash scripts/materialize-synthetic.sh
          bash scripts/materialize-synthetic.sh --answers scripts/fixtures/synthetic-answers/dotnet-vue-codepipeline.json
          bash scripts/materialize-synthetic.sh --answers scripts/fixtures/synthetic-answers/upgrade-8.12.json
          bash scripts/materialize-synthetic.sh --answers scripts/fixtures/synthetic-answers/upgrade-8.12-api.json   # EVOL-072: scope answered, the product laws owed
          python3 -m pip install --quiet pyyaml==6.0.3 jsonschema==4.19.2   # EVOL-081: the merged Bitbucket pipeline and the live pipeline schemas
          for a in java go rust frontend-only bitbucket; do   # EVOL-116: the per-file rows land on every stack, red sources included; EVOL-081: the merged Bitbucket pipeline
            bash scripts/materialize-synthetic.sh --answers "scripts/fixtures/synthetic-answers/$a.json"
          done

      - name: Iteration ID schema validation
        run: |
          chmod +x scripts/check-iteration-id-format.sh
          bash scripts/check-iteration-id-format.sh

      - name: Post violation comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "## 🛑 Governance Check Failed

          One or more governance gates failed. Common causes:

          1. **Manifest drift** — framework core files modified but \`governance_versions.json\` was not updated.
             Update \`.context/templates/setup/governance_versions.json\` (bump \`framework_version\` and the relevant \`framework_core\` / \`templates\` entries). MAJOR bumps require \`BREAKING CHANGE:\` in commit body or \`feat!:\` prefix.

          2. **ADR ↔ Constitution sync** — an ADR file transitioned to \`status: accepted\` without amending \`docs/constitution.md\` in the same diff.
             Run the \`factory-adr-management\` Accept Procedure on each offending ADR (it amends constitution.md atomically). One-shot bypass for historical migration: include \`[adr-backfill]\` in any commit message.

          3. **T2 governance suite** — one of the static template / extraction / ADR-accept / sync-gate tests failed.
             Run locally: \`bash scripts/test-templates-static.sh\` (and the sibling \`scripts/test-*.sh\` suites). Each test is self-contained and prints the failing assertion.

          Run all checks locally: \`./scripts/validate-governance.sh --base main && ./scripts/check-adr-constitution-sync.sh origin/main && for t in scripts/test-*.sh; do case \$t in *red-stacks.sh|*sast-packs.sh) continue;; esac; bash \"\$t\" || break; done\` (\`scripts/test-red-stacks.sh <stack>\` runs in the stack's container — the red-stacks job; \`scripts/test-sast-packs.sh\` in semgrep/semgrep:1.182.0 — the sast-packs job)"

  # EVOL-116: the registry's per-file scoped rows proven on every stack the templates offer, each in its pinned tool
  # image — a passing, a failing and a no-test file per stack (Rust adds its in-source tests). No silent pass: exit 2 is
  # infrastructure and fails the job like a wrong verdict.
  red-stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stack: java, image: "maven:3.9-eclipse-temurin-21" }
          - { stack: go, image: "golang:1.23" }
          - { stack: dotnet, image: "mcr.microsoft.com/dotnet/sdk:8.0" }
          - { stack: rust, image: "rust:1.83" }
          - { stack: node, image: "node:22" }
          - { stack: angular, image: "node:22" }
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Tools the proof needs (python3, git)
        run: command -v python3 >/dev/null && command -v git >/dev/null || { apt-get -qq update && apt-get -qq install -y python3 git >/dev/null; }

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # the fixtures install from public registries; no token left in .git/config

      - name: Red proven per file (${{ matrix.stack }})
        run: bash scripts/test-red-stacks.sh "${{ matrix.stack }}"

  sast-packs:
    # EVOL-074: the SAST base packs proven in the pinned engine — every rule both ways, semgrep --test never vacuous, and
    # per synthetic answer set the landing packs red on the planted defects and green without them (test-sast-packs.sh).
    # The image has no entrypoint: semgrep, bash and python3 are on its PATH. The script's last line is the verdict.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: SAST packs (semgrep/semgrep:1.182.0)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.182.0 sh -c \
            'bash scripts/test-sast-packs.sh >/tmp/t 2>&1; r=$?; cat /tmp/t; [ "$r" -eq 0 ] && grep -q "^test-sast-packs: OK$" /tmp/t'

  contract-parity:
    # EVOL-070: the contract parity gate proven with the real oasdiff — the release binary pinned at 1.15.2, refused
    # unless its sha256 matches; each rule red on its own mismatch, everything agreeing green (test-contract-parity.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: oasdiff 1.15.2 (release binary, sha256 checked)
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 -o /tmp/oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.15.2/oasdiff_1.15.2_linux_amd64.tar.gz
          echo "7623eac18f6893c476ca5b57d0c2f2f9d19d080b0ff8c123f6778d76137cfa9f  /tmp/oasdiff.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar xzf /tmp/oasdiff.tar.gz -C "$HOME/.local/bin" oasdiff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Contract parity
        run: bash scripts/test-contract-parity.sh

  secret-scanner-trufflehog:
    # #189: the shipped trufflehog row, {{RANGE_BASE}} / {{RANGE_HEAD}} resolved, proven with the real binary in its pinned
    # image — the seal's canary (unit test) and the dispatcher (test-security-scan.sh scenario 14). Alpine: git present,
    # python3 added; the image's entrypoint runs trufflehog, so sh is named. A test not run or skipped is never a green.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: trufflehog canary and dispatcher (trufflesecurity/trufflehog:3.99.3)
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/src" -w /src trufflesecurity/trufflehog:3.99.3 -c \
            'apk add -q python3 && git config --global safe.directory "*" && python3 -m unittest scripts/gates/test_gates.py -k trufflehog -v 2>/tmp/u; r=$?; cat /tmp/u; [ "$r" -eq 0 ] && grep -q "^Ran [1-9]" /tmp/u && ! grep -q skipped /tmp/u && bash scripts/test-security-scan.sh >/tmp/s 2>&1; r=$?; cat /tmp/s; [ "$r" -eq 0 ] && grep -q "ok: real trufflehog through the dispatcher" /tmp/s'
